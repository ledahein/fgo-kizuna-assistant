let cbSeq = 0;
function jsonp(params){
  return new Promise(function(resolve, reject){
    const cb = '__j' + (++cbSeq);
    const qs = new URLSearchParams(Object.assign({}, params,
      {format:'json', formatversion:'2', callback:cb}));
    const s = document.createElement('script');
    let done = false;
    const timer = setTimeout(function(){ finish(new Error('超时')); }, 25000);
    function finish(err, data){
      if (done) return; done = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch(e) {}
      if (s.parentNode) s.parentNode.removeChild(s);
      err ? reject(err) : resolve(data);
    }
    window[cb] = function(d){ finish(null, d); };
    s.onerror = function(){ finish(new Error('网络错误')); };
    s.src = 'https://fgo.wiki/api.php?' + qs.toString();
    document.body.appendChild(s);
  });
}

function parseKV(wt){
  const out = [];
  wt.split(/\n\s*\n/).forEach(function(block){
    if (block.indexOf('id=') < 0) return;
    const o = {};
    block.split('\n').forEach(function(line){
      const i = line.indexOf('=');
      if (i > 0) o[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    });
    if (o.id) out.push(o);
  });
  return out;
}

function shortOf(label){
  const m = label.match(/「(.+?)」/);
  let s = m ? m[1] : label;
  if (s.indexOf('：') >= 0) s = s.split('：')[1];
  return s;
}

function parseServantHTML(html, meta){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const all = [].slice.call(doc.querySelectorAll('table.wikitable'));
  const nm = all.filter(function(t){ return (t.className || '').indexOf('nomobile') >= 0; });
  const t = (nm.length ? nm : all)[0];
  if (!t) return null;
  const rows = [].slice.call(t.querySelectorAll('tr'));

  // 「无法召唤」的从者不进库（与 471 口径一致）
  const head = rows[0] ? rows[0].textContent : '';
  if (head.indexOf('无法召唤') >= 0) return {skip: true};

  // 通用字段映射：兼容标准 6 列与「职阶/性别」「属性/副属性」两行式
  const FIELD = {'COST':'cost','稀有度':'rarity','职阶':'cls','属性':'align','副属性':'attr','性别':'gender'};
  const out = {};
  for (let i = 0; i < rows.length - 1; i++){
    const ths = [].slice.call(rows[i].children).filter(function(c){ return c.tagName === 'TH'; })
      .map(function(c){ return c.textContent.trim(); });
    const norm = ths.map(function(h){ return h.split(' ')[0].split('(')[0].trim(); });
    if (!norm.some(function(n){ return FIELD[n]; })) continue;
    const tds = [].slice.call(rows[i + 1].children).filter(function(c){ return c.tagName === 'TD'; })
      .map(function(c){ return c.textContent.trim(); });
    for (let k = 0; k < norm.length; k++){
      const key = FIELD[norm[k]];
      if (key && k < tds.length && !out[key]) out[key] = tds[k];
    }
    if (out.cls && out.align && out.attr && out.gender) break;
  }
  const cls = out.cls || null, align = out.align || null;
  const attr = out.attr || null, gender = out.gender || null;

  let traits = [];
  for (let i = 0; i < rows.length; i++){
    const th = rows[i].querySelector('th');
    if (th && th.textContent.trim().indexOf('特性') === 0){
      const nxt = rows[i + 1];
      const td = nxt && nxt.querySelector('td');
      if (td){
        [].slice.call(td.querySelectorAll('[style*="display:none"]')).forEach(function(e){ e.remove(); });
        const txt = td.textContent.replace(/\s+/g, ' ').trim();
        traits = txt.split('・').map(function(x){ return x.trim(); }).filter(Boolean);
      }
      break;
    }
  }
  // 去掉 [条件] / [1 2] 标记与纯数字参数，去重
  const seen = {};
  traits = traits.map(function(x){
    return x.replace(/\[[^\]]*\]\s*$/, '').trim();
  }).filter(function(x){
    if (!x || /^[\d\s]+$/.test(x)) return false;
    if (seen[x]) return false;
    seen[x] = 1; return true;
  });

  const stages = [];
  for (let i = 0; i < rows.length; i++){
    if ((rows[i].className || '').indexOf('mw-customtoggle') < 0) continue;
    const th = rows[i].querySelector('th');
    if (!th || th.textContent.indexOf('在部分条件时持有的特性') < 0) continue;
    const nx = rows[i].nextElementSibling;
    if (nx){
      [].slice.call(nx.querySelectorAll('li')).forEach(function(li){
        const x = li.textContent.replace(/\s+/g, ' ').trim();
        const m = x.match(/^(.*[」\)）])[：:]\s*(.+)$/);
        if (m){
          const label = m[1].trim();
          stages.push({label: label, short: shortOf(label),
            traits: m[2].split('・').map(function(s){ return s.trim(); }).filter(Boolean)});
        }
      });
    }
    break;
  }

  let rarity = null;
  [].slice.call(t.querySelectorAll('img')).forEach(function(img){
    if (rarity) return;
    const m = (img.getAttribute('src') || '').match(/(\d)星\.png/);
    if (m) rarity = +m[1];
  });
  let no = null;
  const m0 = (t.textContent || '').match(/No\.\s*(\d+)/);
  if (m0) no = +m0[1];

  return {wid: +meta.id, page: meta.name_link, no: no, name: meta.name_cn,
          cls: cls, rarity: rarity, align: align, attr: attr, gender: gender,
          traits: traits, stages: stages, aliases: []};
}

  render();

async function syncAll(){
  const btn = $('btnSync'), msg = $('syncMsg'), out = $('syncResult');
  if (btn.disabled) return;
  btn.disabled = true;
  out.innerHTML = '';
  const log = [];
  try {
    msg.textContent = '拉取从者列表…';
    const d1 = await jsonp({action:'parse', page:'英灵图鉴/数据', prop:'wikitext'});
    const recs = parseKV(d1.parse.wikitext);
    const known = new Set(SERVANTS.map(function(s){ return s.wid; }));
    const added = recs.filter(function(r){
      return !known.has(+r.id) && !skippedSet.has(+r.id) && !UNSUMMONABLE.has(+r.id);
    });
    log.push('从者：线上 ' + recs.length + ' 位 / 本地 ' + known.size + ' 位 / 待查 ' + added.length);

    for (const a of added){
      msg.textContent = '拉取 ' + (a.name_cn || a.name_link) + '…';
      try {
        const p = await jsonp({action:'parse', page:a.name_link, prop:'text', section:'1'});
        const s = parseServantHTML(p.parse.text, a);
        if (s && s.skip){
          skippedSet.add(+a.id); saveSkipped();
          log.push('跳过「' + (a.name_cn || a.name_link) + '」：无法召唤');
        } else if (s){
          overrides.push(s);
          log.push('<span class="new">＋ 新增从者：' + s.name + '（' + s.cls + ' ★' + s.rarity + '，特性 ' + s.traits.length + ' 条）</span>');
        } else {
          log.push('⚠ ' + (a.name_cn || a.name_link) + ' 解析失败，已跳过');
        }
      } catch(e){
        log.push('⚠ ' + (a.name_cn || a.name_link) + ' 拉取失败：' + e.message);
      }
    }
    if (added.length){ saveOverrides(); applyOverrides(); }

    msg.textContent = '拉取礼装列表…';
    const d2 = await jsonp({action:'parse', page:'礼装图鉴/数据', prop:'wikitext'});
    const cr = parseKV(d2.parse.wikitext);
    const ex = cr.filter(function(r){ return r.type === '兑换'; });
    const bond = ex.filter(function(r){
      return (r.des || '').indexOf('牵绊值增加4%') >= 0 &&
             (r.des_max || '').indexOf('牵绊值增加20%') >= 0;
    });
    const cids = new Set(CES.map(function(c){ return c.id; }));
    const cadd = bond.filter(function(r){ return !cids.has(+r.id); });
    log.push('礼装：线上 ' + bond.length + ' 张 / 本地 ' + cids.size + ' 张 / 新增 ' + cadd.length);

    for (const r of cadd){
      msg.textContent = '解析新礼装 ' + r.name + '…';
      try {
        const p = await jsonp({action:'parse', page:'礼装' + r.id, prop:'wikitext', redirects:'1'});
        const expr = parseCESkill(p.parse.wikitext);
        if (expr){
          autoCE.push({id:+r.id, name:r.name, desc:exprDesc(expr), need:1, expr:expr});
          log.push('<span class="new">＋ 新礼装 #' + r.id + ' ' + r.name +
                   '：' + exprDesc(expr) + '</span>');
        } else {
          log.push('⚠ 新礼装 #' + r.id + ' ' + r.name + ' 条件解析失败，需手工加入 CES');
        }
      } catch(e){
        log.push('⚠ 新礼装 #' + r.id + ' 拉取失败：' + e.message);
      }
    }
    if (cadd.length){ saveAutoCE(); rebuildCE(); applyOverrides(); }

    out.innerHTML = log.map(function(l){ return '<div>' + l + '</div>'; }).join('');
    msg.textContent = '完成（从者 ' + SERVANTS.length + ' 位 / 礼装 ' + CES.length + ' 张）';
  } catch(e){
    out.innerHTML = log.join('<br>') +
      '<div class="warn">更新失败：' + e.message + '<br>可能是网络、wiki 改版或 JSONP 被限制。</div>';
    msg.textContent = '失败';
  } finally {
    btn.disabled = false;
  }
}

/* ---------- 判定 ---------- */
function classHas(r, name){
  return (r.cls||'').split(/[&]|\s+\/\s+/).map(s=>s.replace(/\(.*?\)/g,'').trim()).includes(name);
}
function hasTrait(traits, name){
  const esc = name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re = new RegExp('^'+esc+'(\\s*[\\(（][^\\)）]*[\\)）])?$');
  for(const t of traits) if(re.test(t)) return true;
  return false;
}
function isStar(r){ return (r.attr||'').includes('星'); }

/* ---------- 条件表达式：自动解析新礼装 ---------- */
const CLASS_SET = ['Saber','Archer','Lancer','Rider','Caster','Assassin','Berserker',
  'Ruler','Avenger','Alterego','AlterEgo','MoonCancer','Foreigner','Pretender','Shielder'];
let _known = null;
function knownTraits(){
  if (_known) return _known;
  const s = new Set();
  SERVANTS.forEach(function(r){
    (r.traits || []).forEach(function(t){
      s.add(t);
      s.add(t.replace(/\(.*?\)$/, '').trim());
    });
  });
  _known = s;
  return s;
}

function atom(text, prefix){
  text = (text || '').replace(/[\(（].*?[\)）]/g, '').trim();
  if (!text) return {k:'never'};
  if (prefix === '副属性') return {k:'attr', v:text};
  if (CLASS_SET.indexOf(text) >= 0) return {k:'class', v:text};
  if (knownTraits().has(text)) return {k:'trait', v:text};
  if (text === '七骑士') return {k:'seven'};
  if (text.indexOf('星之力') >= 0) return {k:'attr', v:'星'};
  if (text.indexOf('·') >= 0) return {k:'and', items:text.split('·').map(function(x){return atom(x,prefix);})};
  if (text.indexOf('且') >= 0) return {k:'and', items:text.split('且').map(function(x){return atom(x,prefix);})};
  if (text.indexOf('的') >= 0){
    const ps = text.split('的').filter(function(x){ return x.trim(); });
    if (ps.length > 1) return {k:'and', items:ps.map(function(x){return atom(x,prefix);})};
  }
  return {k:'trait', v:text};
}

function evalExpr(e, r, traits){
  if (!e) return false;
  switch (e.k){
    case 'trait': return hasTrait(traits, e.v);
    case 'class': return classHas(r, e.v);
    case 'seven': return SEVEN.some(function(c){ return classHas(r, c); });
    case 'attr':  return (r.attr || '').indexOf(e.v) >= 0;
    case 'and':   return e.items.every(function(x){ return evalExpr(x, r, traits); });
    case 'or':    return e.items.some(function(x){ return evalExpr(x, r, traits); });
    default: return false;
  }
}

function ceHit(ce, r, traits){
  if (ce.fn) return ce.fn(r, traits);
  return evalExpr(ce.expr, r, traits);
}

function exprShort(e){
  if (!e) return '?';
  switch (e.k){
    case 'trait': return e.v;
    case 'class': return e.v;
    case 'seven': return '七骑士';
    case 'attr':  return e.v;
    case 'and':   return e.items.map(exprShort).join('+');
    case 'or':    return e.items.map(exprShort).join('or');
    default: return '?';
  }
}

function ceTag(ce){
  if (ce.tag) return ce.tag;
  if (ce.expr) return exprShort(ce.expr);
  return (ce.desc || '')
    .replace(/\s*职阶\s*$/, '')
    .replace(/^副属性/, '')
    .replace(/特性/g, '')
    .replace(/\s*或\s*/g, 'or')
    .replace(/\s*且\s*/g, '+')
    .replace(/\s+/g, '');
}

function exprDesc(e){
  if (!e) return '?';
  switch (e.k){
    case 'trait': return '特性「' + e.v + '」';
    case 'class': return e.v + ' 职阶';
    case 'seven': return '七骑士';
    case 'attr':  return '副属性「' + e.v + '」';
    case 'and':   return e.items.map(exprDesc).join(' 且 ');
    case 'or':    return e.items.map(exprDesc).join(' 或 ');
    default: return '?';
  }
}

function extractSkill(wt){
  const m = wt.match(/\|持有技能=([\s\S]*?)\n\|/);
  return m ? m[1] : '';
}

function parseCESkill(wt){
  let skill = extractSkill(wt);
  if (!skill) return null;
  const lines = skill.split('\n').filter(function(l){
    return l.indexOf('增加4%') >= 0 || l.indexOf('提升4%') >= 0;
  });
  if (lines.length) skill = lines[0];

  let atoms = [], ops = [], has = false;
  const re = /\{\{特攻\|([^}]*)\}\}/g;
  let last = 0, m;
  while ((m = re.exec(skill))){
    const between = skill.slice(last, m.index);
    const args = m[1].split('|').map(function(x){ return x.trim(); });
    let prefix = null;
    args.slice(1).forEach(function(a){
      if (a.indexOf('前缀=') === 0) prefix = a.split('=')[1].trim();
    });
    if (atoms.length && between){
      if (between.indexOf('或') >= 0) ops.push('or');
      else if (between.indexOf('且') >= 0) ops.push('and');
    }
    atoms.push(atom(args[0] || '', prefix));
    has = true;
    last = re.lastIndex;
  }
  if (!has || !atoms.length) return null;
  if (atoms.length === 1) return atoms[0];
  if (!ops.length) return {k:'and', items:atoms};
  if (ops.every(function(o){ return o === 'or'; })) return {k:'or', items:atoms};
  if (ops.every(function(o){ return o === 'and'; })) return {k:'and', items:atoms};
  let e = atoms[0];
  for (let i = 0; i < ops.length && i + 1 < atoms.length; i++){
    e = {k:ops[i], items:[e, atoms[i+1]]};
  }
  return e;
}

/* ---------- 模糊匹配 ---------- */
function lev(a,b){
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  let prev=[],cur=[];
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    const tmp=prev; prev=cur; cur=tmp;
  }
  return prev[n];
}
function ratio(a,b){ const L=Math.max(a.length,b.length); return L?1-lev(a,b)/L:1; }

const CLS_MAP={saber:'Saber',archer:'Archer',lancer:'Lancer',rider:'Rider',caster:'Caster',
  assassin:'Assassin',berserker:'Berserker',ruler:'Ruler',avenger:'Avenger',alterego:'Alterego',
  mooncancer:'MoonCancer',foreigner:'Foreigner',pretender:'Pretender',shielder:'Shielder'};

function parseQuery(s){
  let q=s.trim(), stage=null, cls=null;
  const ms=q.match(/^(.*?)\s*[-－—–]\s*([0-9一二三四五满])$/);
  if(ms){ q=ms[1]; stage=ms[2]; }
  const keys=Object.keys(CLS_MAP).sort((a,b)=>b.length-a.length);
  for(const k of keys){
    const re=new RegExp('\\s*'+k+'\\s*$','i');
    if(re.test(q)){ cls=CLS_MAP[k]; q=q.replace(re,''); break; }
  }
  return {name:q.trim(), cls, stage};
}

function search(input){
  const {name,cls}=parseQuery(input);
  if(!name && !cls) return {list:[],top:0};
  const arr=[];
  for(const r of SERVANTS){
    let s;
    if(!name){ s=10; }
    else if(r.name===name) s=100;
    else if((r.aliases||[]).includes(name)) s=95;
    else if(r.name.includes(name)) s=80-2*Math.abs(r.name.length-name.length);
    else if((r.aliases||[]).some(a=>a.includes(name))) s=70;
    else s=ratio(name,r.name)*60;
    if(name && name.length>=4 && r.name.length===name.length) s+=15;
    if(cls) s += classHas(r,cls)?20:-1000;
    if(s>0) arr.push({r,s});
  }
  arr.sort((a,b)=>b.s-a.s);
  return {list:arr.slice(0,8).map(x=>x.r), top:arr.length?arr[0].s:0};
}

/* ---------- 阶段特性 ---------- */
function effectiveTraits(r, stageLabel){
  const stages=r.stages||[];
  if(!stages.length) return {traits:new Set(r.traits), why:'无阶段区分，用全部特性'};
  const union=new Set();
  stages.forEach(s=>s.traits.forEach(t=>union.add(t)));
  const common=new Set(r.traits.filter(t=>!union.has(t)));
  if(!stageLabel) return {traits:new Set(r.traits), why:'未指定阶段，用全部形态并集'};
  const hit=stages.find(s=>s.label===stageLabel||s.short===stageLabel);
  if(!hit) return {traits:common, why:'该阶段无条目，用共有特性'};
  return {traits:new Set([...common,...hit.traits]), why:'命中「'+hit.short+'」'};
}

try{ const s=localStorage.getItem('fgo_party'); if(s) party=JSON.parse(s); }catch(e){}
function save(){ try{ localStorage.setItem('fgo_party',JSON.stringify(party)); }catch(e){} }

const SLOTS=['1st','2nd','3rd','4th','5th','6th'];
const $=id=>document.getElementById(id);

function renderCands(input){
  const box=$('cands'), warn=$('warn');
  box.innerHTML=''; warn.innerHTML='';
  if(!input.trim()) return;
  const {name,cls}=parseQuery(input);
  const {list}=search(input);
  if(!list.length){
    warn.innerHTML='<div class="warn">没找到「'+ (name||input) +'」'+(cls?'（'+cls+' 里）':'')+'，换个写法试试</div>';
    return;
  }
  if(cls && list.length){
    const top=list[0];
    warn.innerHTML='<div class="warn">⚠ 未指定阶段时按【全部形态】计算，可能高估；点选后会让你选阶段</div>';
  }
  for(const r of list){
    const d=document.createElement('div');
    d.className='cand';
    const st=(r.stages&&r.stages.length)?'<span class="tag gold">可分阶段</span>':'';
    d.innerHTML='<div><div class="nm">'+r.name+' '+st+'</div>'+
      '<div class="meta">'+r.cls+' ★'+r.rarity+' · '+r.align+' · '+r.attr+' · '+r.gender+'</div></div>'+
      '<div class="tag">'+ (r.traits.slice(0,2).join(' / ')) +'</div>';
    d.onclick=()=>pick(r);
    box.appendChild(d);
  }
}

function pick(r){
  if((r.stages||[]).length){
    $('cands').innerHTML='<div class="empty">选择「'+r.name+'」的战斗形象阶段：</div><div class="sel" id="stageSel"></div>';
    const sel=$('stageSel');
    const mk=(label,text)=>{
      const b=document.createElement('button');
      b.textContent=text; b.onclick=()=>addToParty(r,label); sel.appendChild(b);
    };
    r.stages.forEach(s=>mk(s.label,s.short));
    mk('','未指定（全部形态）');
    return;
  }
  addToParty(r,'');
}

function addToParty(r, stageLabel){
  if(party.length>=6){ alert('队伍已满 6 位'); return; }
  const slot=SLOTS[party.findIndex((p,i)=>!p)>=0?0:party.length]||('#'+(party.length+1));
  party.push({slot:SLOTS[party.length], no:r.no, stage:stageLabel||''});
  save(); $('q').value=''; $('cands').innerHTML=''; $('warn').innerHTML='';
  render();
}

function removeAt(i){ party.splice(i,1); save(); render(); }

function render(){
  const pbox=$('party');
  if(!party.length){ pbox.innerHTML='<div class="empty">还没有从者，先从上面搜索添加</div>'; }
  else{
    pbox.innerHTML='';
    party.forEach((p,i)=>{
      const r=SERVANTS.find(x=>x.no===p.no); if(!r) return;
      const eff=effectiveTraits(r,p.stage);
      const d=document.createElement('div');
      d.className='slot';
      d.innerHTML='<div class="pos">'+p.slot+'</div>'+
        '<div class="who"><div class="nm">'+r.name+'</div>'+
        '<div class="st">'+r.cls+' ★'+r.rarity+' · '+(p.stage? p.stage.replace(/^战斗形象「|」$/g,'') : '未指定阶段')+'</div></div>'+
        '<button class="del">×</button>';
      d.querySelector('.del').onclick=()=>removeAt(i);
      pbox.appendChild(d);
    });
  }
  renderMatrix();
}

function renderMatrix(){
  const box=$('matrix');
  if(!party.length){ box.innerHTML='<div class="empty">添加从者后自动计算</div>'; return; }
  const pos=party.map(p=>{
    const r=SERVANTS.find(x=>x.no===p.no);
    const eff=effectiveTraits(r,p.stage||'');
    return {slot:p.slot, r, traits:eff.traits};
  });
  const rows=CES.map(ce=>{
    const det=pos.map(p=>ceHit(ce,p.r,p.traits));
    return {ce, det, hit:det.filter(Boolean).length};
  }).sort((a,b)=>b.hit-a.hit||a.ce.id-b.ce.id);

  let html='';
  for(const x of rows){
    const cls=x.hit>=4?'b4':x.hit>=2?'b2':x.hit>=1?'b1':'b0';
    const dots=pos.map((p,i)=>'<span class="'+(x.det[i]?'ok':'no')+'">'+p.slot+' '+(x.det[i]?'○':'×')+'</span>').join('　');
    html+='<div class="ce-row">'+
      '<div class="ce-main">'+
        '<div class="ce-name">#'+x.ce.id+' '+x.ce.name+'</div>'+
        '<div class="ce-desc">'+x.ce.desc+(x.ce.need>1?' <span class="and">（需 2 条）</span>':'')+'</div>'+
        '<div class="ce-dots">'+dots+'</div>'+
      '</div>'+
      '<span class="badge '+cls+'">'+x.hit+'</span></div>';
  }
  html+='<div class="hint" style="margin-top:10px">礼装装备后，全队满足条件者均获得加成；每张礼装只有一张</div>';
  box.innerHTML=html;
}

/* ---------- 反向查询 ---------- */
let revCE = null;
let revCls = new Set();
let revRar = new Set();
const ALL_CLS = ['Saber','Archer','Lancer','Rider','Caster','Assassin','Berserker',
  'Ruler','Avenger','Alterego','MoonCancer','Foreigner','Pretender','Shielder'];

function splitCls(r){
  return (r.cls || '').split(/[&]|\s+\/\s+/)
    .map(function(s){ return s.replace(/\(.*?\)/g, '').trim(); })
    .filter(Boolean);
}

function renderRevCE(){
  const box = $('revCE');
  box.innerHTML = '';
  CES.forEach(function(ce){
    const b = document.createElement('div');
    b.className = 'chip' + (ce.id === revCE ? ' act' : '');
    b.textContent = ceTag(ce) + ' 20%绊';
    b.title = '#' + ce.id + ' ' + ce.desc;
    b.onclick = function(){ revCE = ce.id; renderRevCE(); renderRev(); };
    box.appendChild(b);
  });
}

function renderRevCls(){
  const box = $('revCls');
  box.innerHTML = '';
  ALL_CLS.forEach(function(c){
    const b = document.createElement('div');
    b.className = 'chip' + (revCls.has(c) ? ' act' : '');
    b.textContent = c;
    b.onclick = function(){
      if (revCls.has(c)) revCls.delete(c); else revCls.add(c);
      renderRevCls(); renderRev();
    };
    box.appendChild(b);
  });
}

function renderRevRar(){
  const box = $('revRar');
  box.innerHTML = '';
  [5, 4, 3, 2, 1].forEach(function(n){
    const b = document.createElement('div');
    b.className = 'chip' + (revRar.has(n) ? ' act' : '');
    b.textContent = n + '★';
    b.onclick = function(){
      if (revRar.has(n)) revRar.delete(n); else revRar.add(n);
      renderRevRar(); renderRev();
    };
    box.appendChild(b);
  });
}

function renderRev(){
  const out = $('revOut');
  const ce = CES.filter(function(c){ return c.id === revCE; })[0];
  if (!ce){ out.innerHTML = '<div class="empty">先选一张礼装</div>'; return; }
  const list = SERVANTS.filter(function(r){
    if (revRar.size && !revRar.has(r.rarity)) return false;
    if (revCls.size && !splitCls(r).some(function(c){ return revCls.has(c); })) return false;
    return ceHit(ce, r, new Set(r.traits));
  }).sort(function(a, b){ return (b.rarity || 0) - (a.rarity || 0) || a.no - b.no; });

  let html = '<div class="rev-count">#' + ce.id + ' ' + ce.name + ' · ' + ce.desc +
    '　→　<b style="color:#c9a227">' + list.length + '</b> 位' +
    ((revCls.size || revRar.size) ? '（已按职阶/星级筛选）' : '') + '</div>';
  list.forEach(function(r){
    html += '<div class="rev-item"><div>' +
      '<div class="rev-nm">' + r.name + '</div>' +
      '<div class="rev-meta">' + r.cls + ' ★' + r.rarity + ' · ' + r.align +
      ' · ' + r.attr + ' · ' + r.gender + '</div></div></div>';
  });
  if (!list.length) html += '<div class="empty">没有满足条件的从者</div>';
  out.innerHTML = html;
}

function showTab(which){
  const cover = $('tab-cover'), rev = $('tab-rev');
  const b1 = $('tabBtnCover'), b2 = $('tabBtnRev');
  if (which === 'rev'){
    cover.style.display = 'none';
    rev.style.display = '';
    b1.classList.remove('act');
    b2.classList.add('act');
    if (!revCE && CES.length) revCE = CES[0].id;
    if (!CES.filter(function(c){ return c.id === revCE; }).length && CES.length) revCE = CES[0].id;
    renderRevCE(); renderRevCls(); renderRevRar(); renderRev();
  } else {
    cover.style.display = '';
    rev.style.display = 'none';
    b2.classList.remove('act');
    b1.classList.add('act');
  }
}

/* ---------- 事件 ---------- */
let timer=null;
$('q').addEventListener('input',e=>{
  clearTimeout(timer);
  const v=e.target.value;
  timer=setTimeout(()=>renderCands(v),180);
});
$('btnSync').addEventListener('click', syncAll);
$('tabBtnCover').addEventListener('click', function(){ showTab('cover'); });
$('tabBtnRev').addEventListener('click', function(){ showTab('rev'); });
$('syncMsg').textContent = '从者 ' + SERVANTS.length + ' · 礼装 ' + CES.length;
render();
</script>
